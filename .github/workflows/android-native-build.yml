name: Android native APK build

on:
  push:
    branches:
      - agent/android-native-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import zipfile

          paths = sorted(Path('.build/android-source').glob('part_*'))
          parts = [p.read_bytes() for p in paths]

          def decode_and_test(encoded):
              try:
                  data = base64.b64decode(encoded, validate=True)
                  with zipfile.ZipFile(io.BytesIO(data)) as zf:
                      if zf.testzip() is not None:
                          return None
                      names = set(zf.namelist())
                      if 'pkap-android/settings.gradle.kts' not in names:
                          return None
                      if 'pkap-android/app/build.gradle.kts' not in names:
                          return None
                  return data
              except Exception:
                  return None

          combined = b''.join(parts)
          result = decode_and_test(combined)

          if result is None:
              first = parts[0]
              rest = b''.join(parts[1:])
              for i in range(len(first)):
                  result = decode_and_test(first[:i] + first[i + 1:] + rest)
                  if result is not None:
                      print(f'Repaired one corrupt source byte at part_00 offset {i}: {first[i:i+1]!r}')
                      break

          if result is None:
              raise SystemExit('Could not reconstruct a valid Android source ZIP')

          Path('/tmp/pkap-android.zip').write_bytes(result)
          print(f'Validated source ZIP: {len(result)} bytes')
          PY
          unzip -t /tmp/pkap-android.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q /tmp/pkap-android.zip -d buildsrc
          test -f buildsrc/pkap-android/settings.gradle.kts
          test -f buildsrc/pkap-android/app/build.gradle.kts

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p buildsrc/pkap-android --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pkap-android-debug-apk
          path: buildsrc/pkap-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkap-android-build-reports
          path: |
            buildsrc/pkap-android/app/build/reports/**
            buildsrc/pkap-android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
