name: Android native APK build

on:
  push:
    branches:
      - agent/android-native-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          cat .build/android-source/part_* > /tmp/pkap-android.b64
          base64 --decode /tmp/pkap-android.b64 > /tmp/pkap-android.zip
          unzip -t /tmp/pkap-android.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q /tmp/pkap-android.zip -d buildsrc
          test -f buildsrc/pkap-android/settings.gradle.kts
          test -f buildsrc/pkap-android/app/build.gradle.kts

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p buildsrc/pkap-android --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pkap-android-debug-apk
          path: buildsrc/pkap-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkap-android-build-reports
          path: |
            buildsrc/pkap-android/app/build/reports/**
            buildsrc/pkap-android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
